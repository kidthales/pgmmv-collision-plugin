version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: quarterly
      timezone: Canada/Pacific
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
      timezone: Canada/Pacific
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      actions:
        patterns:
          - '*'

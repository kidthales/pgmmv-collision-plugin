name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload-to-release:
    name: Build & Upload Release Asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build release plugin
        run: npm run build -- dist/pgmmv-collision-plugin-${{ github.event.release.tag_name }}.js

      - name: Upload release asset
        run: gh release upload ${{ github.event.release.tag_name }} dist/pgmmv-collision-plugin-${{ github.event.release.tag_name }}.js --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build & Upload Release Asset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release tag and version parity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const tag = process.env.RELEASE_TAG;
            const pkgVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const pluginSrc = fs.readFileSync("plugin.js", "utf8");
            const match = pluginSrc.match(/^\s*\*\s*@version\s+([^\r\n\s]+)/m);
            if (!match) {
              console.error("Missing @version tag in plugin.js");
              process.exit(1);
            }
            const pluginVersion = match[1];
            if (tag !== `v${pkgVersion}` || pluginVersion !== pkgVersion) {
              console.error(`Version mismatch: tag=${tag}, package.json=${pkgVersion}, plugin.js=${pluginVersion}`);
              process.exit(1);
            }
          '

      - name: Run lint and tests
        run: npm run lint && npm test

      - name: Build release plugin
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run build -- "dist/pgmmv-collision-plugin-${RELEASE_TAG}.js"

      - name: Generate SHA-256 checksums
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: (cd dist && sha256sum "pgmmv-collision-plugin-${RELEASE_TAG}.js" > SHA256SUMS.txt)

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload --clobber -- "$RELEASE_TAG" \
            "dist/pgmmv-collision-plugin-${RELEASE_TAG}.js" \
            "dist/SHA256SUMS.txt"
